<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Especial — Jéssica & Rafael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --branco: #FAFAFA;
    --preto: #1A1A1A;
    --dourado: #D4AF37;
    --prata: #B0C4DE;
    --vermelho: #8B0000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #fdfaf3 0%, var(--branco) 60%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: 'Montserrat', sans-serif;
  }
  .card {
    background: #fff; max-width: 420px; width: 100%;
    border-radius: 18px; padding: 40px 30px 34px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    text-align: center; border: 1px solid #f0e9d8;
    opacity: 0; transform: translateY(16px) scale(0.98);
    animation: entraCard 0.8s ease forwards;
  }
  @keyframes entraCard {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .orla { font-size: 1.6rem; color: var(--dourado); margin-bottom: 4px; }
  .nome {
    font-family: 'Great Vibes', cursive; font-size: 2.6rem;
    color: var(--dourado); margin: 6px 0 14px; line-height: 1.1;
  }
  .pergunta {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 1.15rem; color: var(--preto); line-height: 1.6;
    margin-bottom: 28px;
  }
  .botoes { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    border: none; border-radius: 30px; padding: 15px 18px;
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-sim { background: var(--dourado); color: var(--preto); }
  .btn-nao { background: #fff; color: var(--preto); border: 1px solid var(--prata); }
  .resultado { display: none; }
  .resultado.show { display: block; animation: entraResultado 0.7s ease forwards; }
  @keyframes entraResultado {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .coracao {
    font-size: 2.4rem; display: inline-block;
    animation: pulsaCoracao 1.4s ease-in-out infinite;
  }
  @keyframes pulsaCoracao {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  .msg-aceito, .msg-recusado {
    font-family: 'Playfair Display', serif; font-size: 1.05rem;
    color: var(--preto); line-height: 1.65; margin: 14px 0 22px;
  }
  .ir-site {
    display: inline-block; text-decoration: none;
    background: var(--dourado); color: var(--preto);
    font-weight: 700; padding: 14px 20px; border-radius: 30px;
    width: 100%; max-width: 280px; margin: 6px auto 0;
  }
  .senha-box {
    margin-top: 22px; padding: 16px; border-radius: 12px;
    background: #faf6ea; border: 1px dashed var(--dourado);
  }
  .senha-label { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
  .senha-valor {
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.15rem;
    color: var(--preto); letter-spacing: 0.5px; word-break: break-all;
  }
  .senha-dica { font-size: 0.78rem; color: #888; margin-top: 8px; line-height: 1.5; }
  .copiar-senha {
    margin-top: 10px; background: #fff; border: 1px solid var(--prata);
    color: var(--preto); border-radius: 20px; padding: 8px 14px;
    font-family: 'Montserrat', sans-serif; font-size: 0.78rem; cursor: pointer;
  }
  .invalido { color: var(--vermelho); font-family: 'Montserrat', sans-serif; font-size: 0.95rem; }
</style>
</head>
<body>

<div class="card" id="card">
  <div id="conteudo">
    <p class="invalido">Carregando seu convite...</p>
  </div>
</div>

<script>
/* ===== Mesma base de pessoas do site principal (apenas quem recebe convite especial) ===== */
const CONVITE_DB = [
  { senha: 'somospadrinhosel', nome: 'Edmar e Lorrane', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'somospadrinhosjr', nome: 'Jaqueline e Roberto', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'somospadrinhosbv', nome: 'Bruno e Vanessa', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'somospadrinhospg', nome: 'Priscila e Geovane', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'somospadrinhosrv', nome: 'Rafaela e Vagner', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'somospadrinhosif', nome: 'Ivanilda e Fábio', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'somospadrinhosjb', nome: 'Julia e Bruno', papel: 'Padrinhos', genero: 'plural', convite: 'padrinho' },
  { senha: 'joaopadrinho', nome: 'João Vitor', papel: 'Padrinho', genero: 'm', convite: 'padrinho' },
  { senha: 'eduardopadrinho', nome: 'Eduardo', papel: 'Padrinho', genero: 'm', convite: 'padrinho' },
  { senha: 'giovanipadrinho', nome: 'Giovani', papel: 'Padrinho', genero: 'm', convite: 'padrinho' },
  { senha: 'leticiamadrinha', nome: 'Letícia', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'anapaulamadrinha', nome: 'Ana Paula', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'alinemadrinha', nome: 'Aline', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'alanamadrinha', nome: 'Alana', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'manzanomadrinha', nome: 'Adriana Manzano', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'isabelamadrinha', nome: 'Isabela', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'marcelamadrinha', nome: 'Marcela', papel: 'Madrinha', genero: 'f', convite: 'padrinho' },
  { senha: 'geovanadamadehonra', nome: 'Geovana', papel: 'Demoiselle', genero: 'f', convite: 'cortejo' },
  { senha: 'larissadamadehonra', nome: 'Larissa', papel: 'Demoiselle', genero: 'f', convite: 'cortejo' },
  { senha: 'felipehomemdehonra', nome: 'Felipe', papel: 'Groomsmen', genero: 'm', convite: 'cortejo' },
  { senha: 'gustavohomemdehonra', nome: 'Gustavo', papel: 'Groomsmen', genero: 'm', convite: 'cortejo' },
  { senha: 'noivinhahelena', nome: 'Helena', papel: 'Daminha', genero: 'f', convite: 'cortejo' },
  { senha: 'noivinhaisis', nome: 'Ísis', papel: 'Daminha', genero: 'f', convite: 'cortejo' },
  { senha: 'noivinhamaria', nome: 'Maria Clara', papel: 'Daminha', genero: 'f', convite: 'cortejo' },
  { senha: 'noivinhohenrique', nome: 'Henrique', papel: 'Pajem', genero: 'm', convite: 'cortejo' }
];

const PERGUNTAS_POR_PAPEL = {
  'Padrinhos': 'Aceitam ser meus padrinhos de casamento?',
  'Padrinho': 'Aceita ser meu padrinho de casamento?',
  'Madrinha': 'Aceita ser minha madrinha de casamento?',
  'Demoiselle': 'Aceita ser minha demoiselle?',
  'Groomsmen': 'Aceita ser meu groomsman?',
  'Daminha': 'Aceita ser minha daminha de casamento?',
  'Pajem': 'Aceita ser meu pajem de casamento?'
};

const LINK_SITE = 'https://jessicavaladao1996-eng.github.io/CONVITE-/';

/* ===== Firebase (mesmo banco do site principal) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAvAWUNj3EnQD5ZNK5fh3hPBv6543bmvLE",
  authDomain: "casamentojessicaerafael-100727.firebaseapp.com",
  projectId: "casamentojessicaerafael-100727",
  storageBucket: "casamentojessicaerafael-100727.firebasestorage.app",
  messagingSenderId: "33900922338",
  appId: "1:33900922338:web:0f3ce6b72849164ccf65bb"
};
let db = null;

function normalizarSenha(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ''); }
function getParam(name) { return new URLSearchParams(location.search).get(name); }

function saudacao(genero) {
  if (genero === 'f') return 'Bem-vinda';
  if (genero === 'plural') return 'Bem-vindos';
  return 'Bem-vindo';
}

let PESSOA_ATUAL = null;
const conteudo = document.getElementById('conteudo');

function telaInvalida() {
  conteudo.innerHTML = '<p class="invalido">Convite não encontrado. Confira se copiou o link corretamente, ' +
    'ou peça para a Jéssica te enviar de novo. 💛</p>';
}

function telaPergunta(p) {
  const pergunta = PERGUNTAS_POR_PAPEL[p.papel] || 'Aceita esse convite especial?';
  conteudo.innerHTML =
    '<div class="orla">💛</div>' +
    '<p class="nome">' + p.nome + '</p>' +
    '<p class="pergunta">' + pergunta + '</p>' +
    '<div class="botoes">' +
      '<button class="btn btn-sim" id="btn-sim">Sim, aceito! 💛</button>' +
      '<button class="btn btn-nao" id="btn-nao">Vou recusar o convite.</button>' +
    '</div>';
  document.getElementById('btn-sim').addEventListener('click', () => responder('aceito'));
  document.getElementById('btn-nao').addEventListener('click', () => responder('recusado'));
}

function telaAceito(p) {
  conteudo.innerHTML =
    '<div class="resultado show">' +
      '<div class="coracao">💛</div>' +
      '<p class="nome" style="font-size:2.1rem;">' + saudacao(p.genero) + '!</p>' +
      '<p class="msg-aceito">Que alegria, ' + p.nome + '! Ficamos muito felizes com seu "sim". ' +
      'Obrigado por fazer parte desse dia tão especial para nós. 💛</p>' +
      '<a class="ir-site" href="' + LINK_SITE + '" target="_blank" rel="noopener">Ir para o site do casamento</a>' +
      '<div class="senha-box">' +
        '<div class="senha-label">Sua senha para abrir o seu manual</div>' +
        '<div class="senha-valor" id="senha-valor">' + p.senha + '</div>' +
        '<button class="copiar-senha" id="btn-copiar">Copiar senha</button>' +
        '<div class="senha-dica">No site, toque em "Manuais" e digite essa senha para ver todas as orientações do seu papel no nosso casamento.</div>' +
      '</div>' +
    '</div>';
  const btnCopiar = document.getElementById('btn-copiar');
  if (btnCopiar) {
    btnCopiar.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(p.senha); btnCopiar.textContent = 'Copiado ✔'; }
      catch (e) { prompt('Copie sua senha:', p.senha); }
      setTimeout(() => { btnCopiar.textContent = 'Copiar senha'; }, 2000);
    });
  }
}

function telaRecusado(p) {
  conteudo.innerHTML =
    '<div class="resultado show">' +
      '<p class="nome" style="font-size:2.1rem;">Tudo bem, ' + p.nome + '.</p>' +
      '<p class="msg-recusado">Agradecemos de coração o seu carinho e entendemos sua resposta. 💛</p>' +
    '</div>';
}

function chave(p) { return 'convite_especial_' + normalizarSenha(p.senha); }

function salvarResposta(p, resposta) {
  try { localStorage.setItem(chave(p), resposta); } catch (e) {}
  if (db) {
    db.collection('convites_especiais').doc(normalizarSenha(p.senha)).set({
      nome: p.nome,
      papel: p.papel,
      tipo: p.convite,
      resposta: resposta,
      respondidoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(() => {});
  }
}

function responder(resposta) {
  const p = PESSOA_ATUAL;
  if (!p) return;
  salvarResposta(p, resposta);
  if (resposta === 'aceito') telaAceito(p); else telaRecusado(p);
}

(function init() {
  try {
    if (FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined') {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }
  } catch (e) { console.log('Erro ao iniciar o Firebase:', e); }

  const val = normalizarSenha(getParam('p'));
  const found = CONVITE_DB.find((item) => normalizarSenha(item.senha) === val);
  if (!found) { telaInvalida(); return; }
  PESSOA_ATUAL = found;

  let respostaSalva = null;
  try { respostaSalva = localStorage.getItem(chave(found)); } catch (e) {}

  if (respostaSalva === 'aceito') telaAceito(found);
  else if (respostaSalva === 'recusado') telaRecusado(found);
  else telaPergunta(found);
})();
</script>

</body>
</html>
